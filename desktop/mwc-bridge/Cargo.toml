[package]
name = "mwc-bridge"
version = "0.1.0"
edition = "2024"
license = "0BSD"
description = "MobileWebCamera desktop bridge: receives H.264 from the Android app and outputs to v4l2loopback (OBS) or Y4M"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
openh264 = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
