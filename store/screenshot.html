<!doctype html>
<!--
  Google Play のスクリーンショット（1080×1920, 9:16）。store/render.py で PNG にする。
  URL の # 以降で中身を渡す：#img=raw/01.png&title=…&sub=…&lang=ja
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    html, body { margin: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #f0f4f9;
      color: #1f1f1f;
      font-family: "Noto Sans JP", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding: 110px 72px 80px;
    }
    h1 { margin: 0; font-size: 68px; font-weight: 700; line-height: 1.3; text-align: center; }
    p { margin: 20px 0 0; font-size: 38px; font-weight: 500; line-height: 1.5; color: #444746; text-align: center; }
    .shot {
      margin-top: 64px;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
    }
    .shot img {
      height: 100%;
      border-radius: 44px;
      border: 14px solid #000;
      box-shadow: 0 24px 60px rgba(32, 57, 92, .18);
    }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="shot"><img id="img" alt=""></div>
  <script>
    const q = new URLSearchParams(location.hash.slice(1));
    document.documentElement.lang = q.get("lang") || "ja";
    document.getElementById("title").textContent = q.get("title") || "";
    document.getElementById("sub").textContent = q.get("sub") || "";
    document.getElementById("img").src = q.get("img") || "";
  </script>
</body>
</html>
