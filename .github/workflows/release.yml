# v* タグを push すると、署名済み AAB / APK と Rust ブリッジを作って GitHub Release に公開し、
# Play Console の認証情報が登録されていれば Google Play にもアップロードする。
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# 必要な Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 任意の Secrets:  PLAY_SERVICE_ACCOUNT_JSON（未登録なら Play へのアップロードは省略）
# 任意の Variables: PLAY_TRACK（既定 internal）, VERSION_CODE_OFFSET（既定 10）
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android (signed AAB / APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 が未登録です"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Decide version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '10' }}
        run: |
          # versionCode は Play で毎回増やす必要があるので、このワークフローの実行番号から決める
          echo "VERSION_CODE=$(( ${{ github.run_number }} + OFFSET ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/MobileWebCamera-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/MobileWebCamera-$VERSION_NAME.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$VERSION_NAME.txt"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/

      - name: Upload to Google Play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: space.webkombinat.MobileWebCamera
          releaseFiles: dist/MobileWebCamera-${{ env.VERSION_NAME }}.aab
          mappingFile: dist/mapping-${{ env.VERSION_NAME }}.txt
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed

  bridge:
    name: Rust bridge (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, exe: mwc-bridge }
          - { name: windows-x86_64, os: windows-latest, exe: mwc-bridge.exe }
          - { name: macos-arm64, os: macos-latest, exe: mwc-bridge }
    defaults:
      run:
        shell: bash
        working-directory: desktop/mwc-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/mwc-bridge
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd target/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/dist/mwc-bridge-${{ matrix.name }}.zip" "${{ matrix.exe }}"
          else
            tar czf "$GITHUB_WORKSPACE/dist/mwc-bridge-${{ matrix.name }}.tar.gz" "${{ matrix.exe }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-${{ matrix.name }}
          path: dist/

  publish:
    name: GitHub Release
    needs: [android, bridge]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
