# push / PR のたびに Android アプリをビルド・検査する
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (lint / unit test / debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # gradle/gradle-daemon-jvm.properties の toolchainVersion に合わせる

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

